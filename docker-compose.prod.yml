name: jobtrack-ai

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack
      POSTGRES_DB: jobtrack
    volumes:
      - jobtrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack"]
      interval: 5s
      retries: 10
  backend:
    image: ghcr.io/${OWNER:-subramaniyan-code}/jobtrack-backend:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobtrack:jobtrack@db:5432/jobtrack
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    image: ghcr.io/${OWNER:-subramaniyan-code}/jobtrack-frontend:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on: [backend]
    ports: ["3100:3000"]
volumes:
  jobtrack_pgdata:
