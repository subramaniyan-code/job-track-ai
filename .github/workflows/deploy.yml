name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/jobtrack-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: ghcr.io/${{ env.OWNER }}/jobtrack-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER_: ${{ secrets.SSH_USER }}
          DIR: ${{ vars.DEPLOY_PATH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp docker-compose.prod.yml "$USER_@$HOST:$DIR/docker-compose.prod.yml"
          ssh "$USER_@$HOST" "
            set -e
            cd $DIR
            export OWNER=$OWNER TAG=$SHA
            
            # Login with retry (handles transient DNS/network timeout)
            login_success=0
            for i in 1 2 3; do
              echo '$GH_TOKEN' | docker login ghcr.io -u $ACTOR --password-stdin && { login_success=1; break; } || { echo 'Docker login retry in 5s...'; sleep 5; }
            done
            if [ \$login_success -eq 0 ]; then
              echo 'Docker login failed after 3 attempts'
              exit 1
            fi
            
            # Pull with retry
            pull_success=0
            for i in 1 2 3; do
              docker compose -f docker-compose.prod.yml pull && { pull_success=1; break; } || { echo 'Docker pull retry in 5s...'; sleep 5; }
            done
            if [ \$pull_success -eq 0 ]; then
              echo 'Docker pull failed after 3 attempts'
              exit 1
            fi
            
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            docker image prune -f
          "
